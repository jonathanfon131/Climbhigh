# Takes real screenshots of the app in the iPhone 17 simulator (demo data, dark mode)
# and commits them to docs/screenshots/. Run it from the Actions tab ("Run workflow").

name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest stable Xcode 26
        run: ./scripts/select-xcode.sh

      - name: Build for the simulator
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild -project ClimbHigh.xcodeproj -scheme ClimbHigh -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

      - name: Capture screens
        run: ./scripts/take-screenshots.sh build/Build/Products/Debug-iphonesimulator/ClimbHigh.app docs/screenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update app screenshots [skip ci]" || echo "No changes"
          git push
